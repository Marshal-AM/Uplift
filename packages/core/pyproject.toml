[project]
name = "uplift-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rfc8785>=0.1.4",
  "pydantic>=2.11",
  "httpx>=0.28",
  "boto3>=1.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_core"]
