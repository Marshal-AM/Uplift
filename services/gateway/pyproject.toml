[project]
name = "uplift-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "uplift-core",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.54",
  "httpx>=0.28",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.2",
  "pydantic-settings>=2.15",
  "cryptography>=50",
  "boto3>=1.43",
  "pyjwt>=2.15",
  "graphql-core>=3.3",
]

[project.scripts]
uplift-gateway = "uplift_gateway.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_gateway"]
